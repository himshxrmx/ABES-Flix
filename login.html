<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - ABES Flix</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
        }

        nav {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 20px 48px;
            z-index: 10;
        }

        .brand {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 36px;
            color: #E50914;
            text-decoration: none;
            letter-spacing: 2px;
        }

        .page-bg {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(ellipse at top, rgba(229,9,20,0.06) 0%, transparent 50%),
                        #000;
        }

        .card {
            background: rgba(0,0,0,0.78);
            border-radius: 8px;
            padding: 56px 64px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .card h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 20px 16px 8px;
            background: #333;
            border: 1.5px solid transparent;
            border-radius: 4px;
            color: #fff;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #E50914;
        }

        .form-group label {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #8c8c8c;
            font-size: 15px;
            pointer-events: none;
            transition: all 0.15s ease;
        }

        .form-group input:focus + label,
        .form-group input:not(:placeholder-shown) + label {
            top: 10px;
            transform: translateY(0);
            font-size: 11px;
            color: #aaa;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 56px;
        }

        .toggle-pass {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #8c8c8c;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
        }

        .toggle-pass:hover { color: #fff; }

        .error-msg {
            background: rgba(229,9,20,0.15);
            color: #E87C03;
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #E50914;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: background 0.2s;
            margin-top: 8px;
            margin-bottom: 12px;
        }

        .btn-submit:hover { background: #c40812; }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 32px;
        }

        .remember-row input[type="checkbox"] {
            accent-color: #E50914;
            width: 16px;
            height: 16px;
        }

        .remember-row label {
            font-size: 13px;
            color: #b3b3b3;
        }

        .footer-link {
            font-size: 15px;
            color: #737373;
        }

        .footer-link a {
            color: #fff;
            text-decoration: none;
        }

        .footer-link a:hover { text-decoration: underline; }

        @media (max-width: 480px) {
            nav { padding: 16px 20px; }
            .brand { font-size: 28px; }
            .card { padding: 40px 28px; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="brand">ABES FLIX</a>
    </nav>

    <div class="page-bg">
        <div class="card">
            <h1>Sign In</h1>

            <div class="error-msg" id="errorMsg"></div>

            <form id="loginForm">
                <div class="form-group">
                    <div>
                        <input type="email" id="email" required placeholder=" " autocomplete="email">
                        <label for="email">Email address</label>
                    </div>
                </div>
                <div class="form-group">
                    <div class="password-wrapper">
                        <input type="password" id="password" required placeholder=" " autocomplete="current-password">
                        <label for="password">Password</label>
                        <button type="button" class="toggle-pass" onclick="togglePassword()">SHOW</button>
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="submitBtn">Sign In</button>
                <div class="remember-row">
                    <input type="checkbox" id="remember" checked>
                    <label for="remember">Remember me</label>
                </div>
            </form>

            <div class="footer-link">
                New to ABES Flix? <a href="signup.html">Sign up now</a>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            var input = document.getElementById('password');
            var btn = document.querySelector('.toggle-pass');
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = 'HIDE';
            } else {
                input.type = 'password';
                btn.textContent = 'SHOW';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var btn = document.getElementById('submitBtn');
            var errorEl = document.getElementById('errorMsg');
            errorEl.style.display = 'none';

            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;

            if (!email || !password) {
                errorEl.textContent = 'Please enter a valid email and password.';
                errorEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                var res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });

                var data = await res.json();

                if (!res.ok) {
                    errorEl.textContent = data.error || 'Login failed.';
                    errorEl.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                    return;
                }

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = 'home.html';
            } catch (err) {
                errorEl.textContent = 'Unable to connect. Check your network and try again.';
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });

        if (localStorage.getItem('token')) {
            window.location.href = 'home.html';
        }
    </script>
</body>
</html>
